version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - column: "invoices.confirmed_by"
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
          - column: "tickets.assigned_membership_id"
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
          - column: "kapster_session_state.current_ticket_id"
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
          - column: "ticket_events.actor_membership_id"
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
          - db_type: "citext"
            go_type: "string"
          - column: "tickets.final_payment_confirmed_by"
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
          - column: "ticket_payments.customer_user_id"
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"
          - column: "ticket_payments.confirmed_by"
            go_type: "github.com/jackc/pgx/v5/pgtype.UUID"