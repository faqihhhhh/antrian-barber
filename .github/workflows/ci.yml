name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7

      - name: Siapkan Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Tes dan build backend
        run: |
          go test -C backend ./...
          go build -C backend ./...

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            website/package-lock.json

      - name: Build dan lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          if grep -q 'localhost:5173' dist/index.html; then
            echo "::error::Tautan produksi website masih memakai localhost"
            exit 1
          fi
          npm run lint

      - name: Build website
        working-directory: website
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_APP_URL: https://app.example.com
        run: |
          npm ci
          npm run build

      - name: Periksa Compose produksi
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q

      - name: Periksa Caddyfile
        run: >-
          docker run --rm
          -e APP_DOMAIN=app.example.com
          -e WEBSITE_DOMAIN=example.com
          -v "$GITHUB_WORKSPACE/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build image API
        run: docker build -f backend/Dockerfile -t kapsflow-api:ci backend

