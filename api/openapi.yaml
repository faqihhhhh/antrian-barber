          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/kapster-states:
    get:
      operationId: listKapsterStates
      tags: [antrian]
      summary: Status kerja kapster dalam sesi
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Status kerja tanpa kolom internal database
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KapsterState'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/ready:
    post:
      operationId: kapsterReady
      tags: [kapster]
      summary: Panggil tiket waiting berikutnya
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Tiket yang dipanggil, atau pesan jika antrian kosong
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QueueTicket'
                  - $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/pause:
    post:
      operationId: kapsterPause
      tags: [kapster]
      summary: Berhenti sementara dari status siap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Kapster kembali ke status tidak siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/start:
    post:
      operationId: kapsterStart
      tags: [kapster]
      summary: Mulai melayani tiket yang dipanggil
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Layanan dimulai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/skip:
    post:
      operationId: kapsterSkip
      tags: [kapster]
      summary: Lewati pelanggan dan panggil tiket berikutnya
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Tiket berikutnya atau pesan jika tidak ada pelanggan lain
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QueueTicket'
                  - $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/complete:
    post:
      operationId: kapsterComplete
      tags: [kapster]
      summary: Selesaikan layanan tiket aktif
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Layanan selesai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/outlets/{outletID}/book:
    post:
      operationId: bookOnline
      tags: [pelanggan]
      summary: Pesan tiket antrian online
      description: |
        Tiket berstatus `pending_payment` sampai DP dibayar. Satu pelanggan hanya boleh
        punya satu pesanan belum dibayar per sesi. Pesanan yang tidak dibayar hangus
        otomatis dan kuotanya kembali.
        Kode error: `tanggal_sudah_lewat`, `harga_dp_belum_diatur`, `pembayaran_belum_diatur`,
        `sesi_tidak_ditemukan`, `tidak_bisa_memesan` (kuota penuh atau sesi tutup),
        `masih_ada_pesanan_belum_dibayar`, `nama_terlalu_panjang`,
        `berlangganan_diperlukan` (402).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/OutletID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Tiket dibuat, menunggu pembayaran DP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/tickets/{ticketID}/recheck-payment:
    post:
      operationId: recheckPayment
      tags: [pelanggan]
      summary: Cek ulang status pembayaran DP
      description: |
        Untuk pembayaran Midtrans, menanyakan status langsung ke Midtrans (berguna kalau
        notifikasi otomatis terlambat). Untuk pembayaran manual hanya mengembalikan status.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/TicketID'
      responses:
        '200':
          description: Status pembayaran saat ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/profile/manual-qris:
    delete:
      operationId: deleteManualQris
      tags: [owner]
      summary: Hapus QRIS manual yang tersimpan
      description: Hanya owner. Pemesanan DP manual tidak dapat dilakukan sampai QRIS dipasang kembali.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: QRIS dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setManualQris
      tags: [owner]
      summary: Unggah gambar QRIS statis untuk mode DP manual
      description: |
        Hanya owner. Body berisi gambar mentah (bukan multipart), maksimal 512 KB.
        Jenis file dicek dari isinya.
        Kode error: `bukan_owner`, `gambar_kosong`, `gambar_terlalu_besar`,
        `format_gambar_tidak_didukung`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/tickets:
    get:
      operationId: listMyTickets
      tags: [pelanggan]
      summary: Tiket saya
      description: |
        Tiket aktif dan yang selesai dalam 7 hari terakhir. `estimate` hanya terisi untuk
        tiket berstatus `waiting`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Daftar tiket
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTicket'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/tickets/{ticketID}/qris-image:
    get:
      operationId: getTicketQrisImage
      tags: [pelanggan]
      summary: Gambar QRIS owner untuk membayar DP manual
      description: |
        Hanya untuk pemilik tiket yang pembayaran manualnya masih menunggu.
        Selain itu membalas 404 `qris_tidak_tersedia`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketID'
      responses:
        '200':
          description: Gambar QRIS
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/tickets/{ticketID}/review:
    post:
      operationId: submitReview
      tags: [pelanggan]
      summary: Beri nilai layanan setelah tiket selesai
      description: |
        Hanya pemilik tiket, hanya untuk tiket berstatus `completed`, satu kali per tiket.
        Kode error: `rating_tidak_valid` (harus 1 sampai 5), `komentar_terlalu_panjang`,
        `tiket_belum_selesai`, `sudah_memberi_ulasan`, `bukan_pemilik_tiket`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/TicketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Ulasan tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        default:
          $ref: '#/components/responses/Error'
  
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: trimwait_session
  parameters:
    TenantID:
      name: tenantID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutletID:
      name: outletID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticketID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Terjadi kesalahan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PlatformStats:
      type: object
      required: [tenants, revenue, billing, activity_30d, monthly]
      properties:
        tenants:
          $ref: '#/components/schemas/PlatformTenants'
        revenue:
          $ref: '#/components/schemas/PlatformRevenue'
        billing:
          $ref: '#/components/schemas/PlatformBilling'
        activity_30d:
          $ref: '#/components/schemas/PlatformActivity'
        monthly:
          type: array
          items:
            $ref: '#/components/schemas/PlatformMonthPoint'
    PlatformTenants:
      type: object
      required: [total, never_subscribed, active, grace, read_only, churned_30d, ever_paid, midtrans_configured, onboarding_completed, outlets, staff, users]
      properties:
        total: { type: integer, format: int64 }
        never_subscribed: { type: integer, format: int64 }
        active: { type: integer, format: int64 }
        grace: { type: integer, format: int64 }
        read_only: { type: integer, format: int64 }
        churned_30d: { type: integer, format: int64 }
        churn_rate_30d_pct: { type: number, format: double, nullable: true }
        ever_paid: { type: integer, format: int64 }
        conversion_pct: { type: number, format: double, nullable: true }
        midtrans_configured: { type: integer, format: int64 }
        onboarding_completed: { type: integer, format: int64 }
        outlets: { type: integer, format: int64 }
        staff: { type: integer, format: int64 }
        users: { type: integer, format: int64 }
    PlatformRevenue:
      type: object
      required: [mrr_rupiah, arr_rupiah, arpa_rupiah]
      properties:
        mrr_rupiah: { type: integer, format: int64 }
        arr_rupiah: { type: integer, format: int64 }
        arpa_rupiah: { type: integer, format: int64 }
    PlatformBilling:
      type: object
      required: [pending_invoices, pending_amount_rupiah, expiring_7d, expiring_7d_rupiah]
      properties:
        pending_invoices: { type: integer, format: int64 }
        pending_amount_rupiah: { type: integer, format: int64 }
        expiring_7d: { type: integer, format: int64 }
        expiring_7d_rupiah: { type: integer, format: int64 }
    PlatformActivity:
      type: object
      required: [active_outlets, tickets_completed, gmv_rupiah]
      properties:
        active_outlets: { type: integer, format: int64 }
        tickets_completed: { type: integer, format: int64 }
        gmv_rupiah: { type: integer, format: int64 }
    PlatformMonthPoint:
      type: object
      required: [month, tenants_created, invoices_paid, revenue_rupiah]
      properties:
        month: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        tenants_created: { type: integer, format: int64 }
        invoices_paid: { type: integer, format: int64 }
        revenue_rupiah: { type: integer, format: int64 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kode stabil untuk logika di frontend, misalnya `kredensial_salah`.
            message:
              type: string
              description: Pesan berbahasa Indonesia yang aman ditampilkan ke pengguna.
    SessionSnapshot:
      type: object
      required: [session_id, status, waiting_count, active_kapsters, estimated_wait_minutes, updated_at]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        waiting_count:
          type: integer
          format: int64
        active_kapsters:
          type: integer
          format: int64
        estimated_wait_minutes:
          type: number
          description: |
            Estimasi menunggu untuk pelanggan yang tiba sekarang. Memakai rata-rata jeda
            panggilan nyata kalau datanya ada, jika belum ada memakai durasi bawaan outlet.
        updated_at:
          type: string
          format: date-time
    QueueSession:
      type: object
      required: [id, outlet_id, session_date, max_quota, used_quota, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        outlet_id:
          type: string
          format: uuid
        session_date:
          type: string
          format: date
        max_quota:
          type: integer
        used_quota:
          type: integer
        status:
          type: string
          enum: [open, closed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    QueueTicket:
      type: object
      required: [id, ticket_number, queue_position, channel, customer_name, match_code, status, has_been_called]
      properties:
        id:
          type: string
          format: uuid
        ticket_number:
          type: integer
        queue_position:
          type: integer
        channel:
          type: string
          enum: [offline, online]
        customer_name:
          type: string
          description: Kosong untuk tiket tanpa nama.
        match_code:
          type: string
          description: Kosong untuk tiket offline.
        status:
          type: string
          enum: [pending_payment, waiting, called, in_progress, completed, canceled]
        has_been_called:
          type: boolean
          description: True jika tiket pernah dipanggil kapster sebelumnya atau saat ini.
    PendingManualPayment:
      type: object
      required: [ticket_id, ticket_number, customer_name, match_code, method, amount_rupiah, expires_at]
      properties:
        ticket_id:
          type: string
          format: uuid
        ticket_number:
          type: integer
        customer_name:
          type: string
        match_code:
          type: string
        method:
          type: string
          enum: [manual]
        amount_rupiah:
          type: integer
          format: int64
        unique_code:
          type: integer
          format: int32
          nullable: true
        expires_at:
          type: string
          format: date-time
    KapsterState:
      type: object
      required: [membership_id, status, current_ticket_id]
      properties:
        membership_id:
          type: string
          format: uuid
        status:
