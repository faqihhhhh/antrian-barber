openapi: 3.0.3
info:
  title: Trimwait API
  version: 0.1.0
  description: |
    Kontrak API Trimwait, ditulis bertahap per layar. Endpoint yang belum ada
    di sini belum didokumentasikan, bukan berarti tidak ada.

    Autentikasi memakai cookie sesi httpOnly (`trimwait_session`) yang dipasang
    oleh `POST /v1/auth/login`. Semua error memakai bentuk `ErrorResponse`.
servers:
  - url: /
paths:
  /v1/plans/:
    get:
      operationId: listPlans
      tags: [langganan]
      summary: Daftar paket langganan aktif
      responses:
        '200':
          description: Paket langganan yang tersedia
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicPlan' }
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/stats:
    get:
      operationId: getPlatformStats
      tags: [platform]
      summary: Ringkasan tenant dan pendapatan untuk pemilik SaaS
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Statistik agregat platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/invoices:
    get:
      operationId: listPlatformInvoices
      tags: [platform]
      summary: Daftar tagihan langganan tertunda dan yang baru kedaluwarsa
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Daftar tagihan untuk pemilik SaaS
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminInvoice' }
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/invoices/{invoiceID}/confirm:
    post:
      operationId: confirmPlatformManualInvoice
      tags: [platform]
      summary: Konfirmasi pembayaran QRIS manual
      security:
        - cookieAuth: []
      parameters:
        - name: invoiceID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tagihan ditandai lunas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/payment-settings:
    get:
      operationId: getPlatformPaymentSettings
      tags: [platform]
      summary: Status metode pembayaran langganan platform
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Status konfigurasi pembayaran
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformPaymentInfo' }
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/payment-settings/manual-qris:
    put:
      operationId: uploadPlatformManualQRIS
      tags: [platform]
      summary: Unggah QRIS statis untuk pembayaran langganan manual
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: QRIS manual platform tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePlatformManualQRIS
      tags: [platform]
      summary: Hapus QRIS manual platform
      security:
        - cookieAuth: []
      responses:
        '200':
          description: QRIS manual platform dihapus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/payment-settings/manual-qris/image:
    get:
      operationId: getPlatformManualQRISImage
      tags: [platform]
      summary: Ambil gambar QRIS platform untuk pratinjau admin
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Gambar QRIS platform
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        default:
          $ref: '#/components/responses/Error'
  /v1/admin/plans/{planCode}:
    put:
      operationId: updatePlatformPlanPrice
      tags: [platform]
      summary: Ubah harga paket bulanan atau tahunan
      security:
        - cookieAuth: []
      parameters:
        - name: planCode
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price_rupiah]
              properties:
                price_rupiah: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Harga paket diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPlan' }
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/push/public-key:
    get:
      operationId: getPushPublicKey
      tags: [notifikasi]
      summary: Kunci publik VAPID untuk mendaftarkan notifikasi perangkat
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Kunci publik VAPID
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/push/subscribe:
    post:
      operationId: subscribePush
      tags: [notifikasi]
      summary: Simpan subscription notifikasi untuk akun saat ini
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                  format: uri
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
      responses:
        '201':
          description: Notifikasi diaktifkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/push/unsubscribe:
    post:
      operationId: unsubscribePush
      tags: [notifikasi]
      summary: Hapus subscription notifikasi dari akun saat ini
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
      responses:
        '200':
          description: Notifikasi dimatikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Daftar akun baru
      description: |
        Selalu membalas 202 dengan pesan yang sama, baik email itu baru maupun
        sudah terdaftar, supaya tidak membocorkan email siapa yang sudah punya akun.
        Kode error: `password_terlalu_pendek`, `display_name_tidak_valid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Masuk dengan email dan password
      description: |
        Kode error: `kredensial_salah` (401), `email_belum_verifikasi` (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Berhasil masuk. Cookie sesi dipasang lewat header Set-Cookie.
          headers:
            Set-Cookie:
              description: Cookie sesi httpOnly
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Keluar dan mencabut sesi
      responses:
        '200':
          description: Berhasil keluar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verifikasi email dengan token dari tautan di email
      description: |
        Kode error: `token_tidak_valid` (tautan salah, sudah dipakai, atau kedaluwarsa),
        `token_wajib`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Email terverifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Kirim ulang email verifikasi
      description: Selalu membalas 202, apa pun status emailnya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Minta tautan atur ulang password
      description: Selalu membalas 202, apa pun status emailnya. Tautan berlaku 1 jam.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Atur password baru dengan token dari email
      description: |
        Kode error: `token_tidak_valid`, `password_terlalu_pendek`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      operationId: getMe
      tags: [akun]
      summary: Siapa saya, bisnis dan peran saya, outlet yang boleh saya akses
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Konteks akun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeContext'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/display_name:
    put:
      operationId: setMyDisplayName
      tags: [akun]
      summary: Atur atau ubah nama panggilan akun
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/DisplayNameRequest'
      responses:
        '200':
          description: Nama panggilan tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayNameResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/tenants/{tenantID}/work-roles:
    put:
      operationId: setMyWorkRoles
      tags: [akun]
      summary: Aktifkan ruang Admin atau Kapster untuk owner
      description: Owner hanya dapat mengatur peran operasional pada membership miliknya sendiri. Peran owner selalu dipertahankan.
      security:
        - cookieAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerWorkRolesRequest'
      responses:
        '200':
          description: Peran owner diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerWorkRolesResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/password:
    put:
      operationId: changeMyPassword
      tags: [akun]
      summary: Ganti password akun yang sedang masuk
      description: Password saat ini wajib cocok. Password baru minimal 8 karakter.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/:
    post:
      operationId: createTenant
      tags: [tenant]
      summary: Buat bisnis baru dan jadikan akun saat ini sebagai owner
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Bisnis baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/outlets:
    post:
      operationId: createOwnerOutlet
      tags: [tenant]
      summary: Buat outlet untuk tenant yang langganannya aktif
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutletRequest'
      responses:
        '201':
          description: Outlet berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerOutlet'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listOwnerOutlets
      tags: [tenant]
      summary: Daftar outlet dan pengaturan yang hanya boleh dilihat owner
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Daftar outlet tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerOutlet'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/outlets/{outletID}/settings:
    patch:
      operationId: updateOwnerOutletSettings
      tags: [tenant]
      summary: Ubah harga DP dan durasi layanan bawaan outlet
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/OutletID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutletSettingsRequest'
      responses:
        '200':
          description: Pengaturan outlet terbaru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerOutlet'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/staff:
    get:
      operationId: listTenantStaff
      tags: [staf]
      summary: Daftar staf bisnis untuk owner
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Daftar admin dan kapster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: inviteTenantStaff
      tags: [staf]
      summary: Buat akun staf dan kirim verifikasi email
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteStaffRequest'
      responses:
        '201':
          description: Akun staf dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/stats/overview:
    get:
      operationId: getTenantStatsOverview
      tags: [statistik]
      summary: Ringkasan statistik tenant untuk 30 hari terakhir
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Ringkasan antrian dan pendapatan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsOverview'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/reviews:
    get:
      operationId: listOwnerReviews
      tags: [ulasan]
      summary: Daftar ulasan pelanggan tanpa identitas pelanggan
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Ulasan terbaru
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnerReview' }
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/reviews/summary:
    get:
      operationId: getOwnerReviewSummary
      tags: [ulasan]
      summary: Ringkasan rating untuk setiap kapster
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Jumlah dan rata-rata rating kapster
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnerReviewSummary' }
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/subscription:
    get:
      operationId: getOwnerSubscription
      tags: [langganan]
      summary: Status langganan tenant untuk owner
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Status paket dan periode langganan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSubscription' }
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/subscription/payment-options:
    get:
      operationId: getOwnerSubscriptionPaymentOptions
      tags: [langganan]
      summary: Metode pembayaran langganan yang tersedia untuk owner
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Status QRIS manual dan Midtrans platform
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOptions' }
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/subscription/manual-qris:
    get:
      operationId: getOwnerPlatformManualQRIS
      tags: [langganan]
      summary: Gambar QRIS platform untuk pembayaran manual owner
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Gambar QRIS platform
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/subscribe:
    post:
      operationId: createOwnerSubscriptionInvoice
      tags: [langganan]
      summary: Buat tagihan langganan owner pada waktu perpanjangan yang diizinkan
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscribeRequest' }
      responses:
        '201':
          description: Tagihan langganan dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerInvoice' }
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/invoices:
    get:
      operationId: listOwnerInvoices
      tags: [langganan]
      summary: Riwayat tagihan tenant untuk owner
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Daftar ringkas tagihan
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnerInvoice' }
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/profile:
    get:
      operationId: getOwnerPaymentProfile
      tags: [owner]
      summary: Status pengaturan pembayaran bisnis tanpa mengirim rahasia
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Status konfigurasi pembayaran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerPaymentProfile'
        default:
          $ref: '#/components/responses/Error'
  /v1/public/outlets/{slug}:
    get:
      operationId: getPublicOutlet
      tags: [publik]
      summary: Halaman publik outlet (tanpa login)
      description: |
        Dipakai pelanggan yang membuka tautan atau QR outlet. `local_today` dan `days`
        memakai tanggal lokal outlet (zona waktu outlet), bukan zona waktu server.
        Kode error: `outlet_tidak_ditemukan` (404).
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Info outlet, 14 hari ke depan, dan kondisi antrian hari ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/public/outlets:
    get:
      operationId: listPublicOutlets
      tags: [publik]
      summary: Daftar outlet yang dapat dikunjungi pelanggan
      responses:
        '200':
          description: Daftar outlet publik dengan nama bisnis dan tautannya
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicOutletDirectoryEntry' }
        default:
          $ref: '#/components/responses/Error'
  /v1/public/queue-sessions/{sessionID}/stream:
    get:
      operationId: streamQueueSession
      tags: [publik]
      summary: Aliran realtime kondisi antrian (Server-Sent Events)
      description: |
        Koneksi tetap terbuka. Setiap event `data:` berisi JSON `SessionSnapshot`, dikirim
        sekali saat terhubung lalu setiap kali antrian berubah. Baris `: keep-alive`
        dikirim berkala dan boleh diabaikan. Pakai `EventSource`, bukan fetch.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Aliran event
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/outlets/{outletID}/queue-sessions:
    get:
      operationId: listQueueSessions
      tags: [antrian]
      summary: Daftar sesi antrian outlet
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/OutletID'
      responses:
        '200':
          description: Sesi outlet, dari yang terbaru
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueSession'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createQueueSession
      tags: [admin]
      summary: Buka sesi antrian baru untuk outlet
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/OutletID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_date, max_quota]
              properties:
                session_date:
                  type: string
                  format: date
                max_quota:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Sesi baru dibuka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSession'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/tickets:
    get:
      operationId: listQueueTickets
      tags: [antrian]
      summary: Daftar tiket dalam sesi
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Tiket untuk layar operasional
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueTicket'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addOfflineQueueTicket
      tags: [admin]
      summary: Tambahkan tiket pelanggan yang datang langsung
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name]
              properties:
                customer_name:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Tiket berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicket'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/pending-manual-payments:
    get:
      operationId: listPendingManualPayments
      tags: [antrian]
      summary: Daftar DP QRIS manual yang belum dikonfirmasi admin
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Data tiket dan nominal DP untuk pencocokan pembayaran
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingManualPayment'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/increase-quota:
    post:
      operationId: increaseQueueQuota
      tags: [admin]
      summary: Tambahkan kuota sesi antrian
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [by]
              properties:
                by:
                  type: integer
                  minimum: 1
                  description: Jumlah tambahan kuota, bukan nilai kuota total.
      responses:
        '200':
          description: Kuota sesi setelah ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSession'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/close:
    post:
      operationId: closeQueueSession
      tags: [admin]
      summary: Tutup sesi setelah semua tiket selesai
      description: Sesi ditolak untuk ditutup selama masih ada tiket pending pembayaran atau belum selesai dilayani.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Sesi ditutup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSession'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/tickets/{ticketID}/confirm-manual-payment:
    post:
      operationId: confirmManualPayment
      tags: [admin]
      summary: Konfirmasi DP QRIS manual dan masukkan tiket ke antrian
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pembayaran dikonfirmasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/tenants/{tenantID}/queue-sessions/{sessionID}/awaiting-settlement:
    get:
      operationId: listTicketsAwaitingSettlement
      tags: [admin]
      summary: Daftar tiket selesai yang menunggu konfirmasi pelunasan
      security:
        - cookieAuth: []
      parameters:
